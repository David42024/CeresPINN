# Render Blueprint for the CeresPINN backend (FastAPI + PINN).
#
# IMPORTANT: The root directory is the repository root ("./") so that `backend`
# remains importable as a package (`from backend.app import app`) exactly as it is
# run locally. Only this Python service is described here; the frontend lives on
# Vercel.
#
# The Docker build validates the committed checkpoint and fails if PyTorch cannot
# load it. This prevents a successful deployment backed by a silent surrogate.

services:
  - type: web
    name: cerespinn-backend
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    rootDir: .
    healthCheckPath: /api/health
    envVars:
      - key: CERESPINN_DRY_RUN
        value: "1"
      - key: PORT
        sync: false
      - key: CERESPINN_MODEL_DIR
        value: /app/backend/models
      - key: CERESPINN_REQUIRE_MODEL
        value: "1"
      # Set to the production Vercel origin. Multiple origins are comma-separated.
      - key: FRONTEND_ORIGINS
        sync: false
      # Set this in the Render dashboard to the Supabase connection string:
      - key: DATABASE_URL
        sync: false
