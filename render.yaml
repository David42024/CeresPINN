# Render Blueprint for the CeresPINN backend (FastAPI + PINN).
#
# IMPORTANT: The root directory is the repository root ("./") so that `backend`
# remains importable as a package (`from backend.app import app`) exactly as it is
# run locally. Only this Python service is described here; the frontend lives on
# Vercel.
#
# The Docker build validates the committed checkpoint and fails if PyTorch cannot
# load it. This prevents a successful deployment backed by a silent surrogate.

services:
  - type: web
    name: cerespinn-backend
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    rootDir: .
    healthCheckPath: /api/health
    envVars:
      - key: CERESPINN_DRY_RUN
        value: "1"
      - key: PORT
        sync: false
      - key: CERESPINN_MODEL_DIR
        value: /app/backend/models
      - key: CERESPINN_REQUIRE_MODEL
        value: "1"
      - key: CERESPINN_REQUIRE_REAL_DATA
        value: "1"
      - key: CERESPINN_REQUIRE_DATABASE
        value: "1"
      # Production alias verified from the latest successful Vercel deployment.
      - key: FRONTEND_ORIGINS
        value: https://ceres-pinn.vercel.app
      # Covers stable and generated Preview URLs for the ceres-pinn Vercel project.
      - key: FRONTEND_ORIGIN_REGEX
        value: '^https://ceres-pinn(?:-[a-z0-9-]+)?\.vercel\.app$'
      # Set this in the Render dashboard to the Supabase connection string:
      - key: DATABASE_URL
        sync: false
      # Backend-only secret used by /api/chatbot. Never put it in Vercel.
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-flash-latest
