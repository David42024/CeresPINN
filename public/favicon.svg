<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="100%" height="100%">
  <defs>
    <!-- Minimalist Gradients -->
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="netGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
  </defs>

  <style>
    .leaf { fill: none; stroke: url(#leafGrad); stroke-width: 2.5; stroke-linejoin: round; }
    .leaf-inner { fill: none; stroke: #34d399; stroke-width: 1.5; opacity: 0.8; }
    .circuit { fill: none; stroke: #0d9488; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .net-edge { fill: none; stroke: url(#netGrad); stroke-width: 1.5; }
    .node { fill: #06b6d4; stroke: #0369a1; stroke-width: 1.2; }
    .circuit-node { fill: #14b8a6; stroke: #0f766e; stroke-width: 1.5; }
  </style>

  <g transform="translate(0, 5)">
    <!-- STEM &amp; CIRCUITS -->
    <path class="circuit" d="M 100,125 L 100,175" />
    <path class="circuit" d="M 100,175 L 80,195 L 80,220" />
    <path class="circuit" d="M 100,150 L 120,170 L 120,205" />
    
    <circle class="circuit-node" cx="80" cy="220" r="3.5" />
    <circle class="circuit-node" cx="120" cy="205" r="3.5" />

    <!-- LEAVES (Low-Poly Minimalist) -->
    <!-- Upper Left -->
    <path class="leaf" d="M 100,125 L 40,60 L 20,110 L 80,150 Z" />
    <path class="leaf-inner" d="M 40,60 L 80,150" />
    <path class="leaf-inner" d="M 20,110 L 100,125" />
    
    <!-- Upper Right -->
    <path class="leaf" d="M 100,125 L 160,60 L 180,110 L 120,150 Z" />
    <path class="leaf-inner" d="M 160,60 L 120,150" />
    <path class="leaf-inner" d="M 180,110 L 100,125" />

    <!-- Lower Left -->
    <path class="leaf" d="M 90,145 L 30,150 L 40,180 L 85,165 Z" />
    <path class="leaf-inner" d="M 30,150 L 85,165" />

    <!-- Lower Right -->
    <path class="leaf" d="M 110,145 L 170,150 L 160,180 L 115,165 Z" />
    <path class="leaf-inner" d="M 170,150 L 115,165" />

    <!-- COB NEURAL NETWORK (Minimalist Diamond) -->
    <g class="net-edge">
      <!-- Horizontal connections -->
      <line x1="80" y1="50" x2="120" y2="50" />
      <line x1="60" y1="75" x2="140" y2="75" />
      <line x1="80" y1="100" x2="120" y2="100" />
      
      <!-- Diagonal Left-Down -->
      <line x1="100" y1="25" x2="60" y2="75" />
      <line x1="120" y1="50" x2="80" y2="100" />
      <line x1="140" y1="75" x2="100" y2="125" />
      
      <!-- Diagonal Right-Down -->
      <line x1="100" y1="25" x2="140" y2="75" />
      <line x1="80" y1="50" x2="120" y2="100" />
      <line x1="60" y1="75" x2="100" y2="125" />
    </g>

    <!-- Nodes -->
    <!-- Row 1 -->
    <circle class="node" cx="100" cy="25" r="3.5" />
    <!-- Row 2 -->
    <circle class="node" cx="80" cy="50" r="3.5" />
    <circle class="node" cx="120" cy="50" r="3.5" />
    <!-- Row 3 -->
    <circle class="node" cx="60" cy="75" r="3.5" />
    <circle class="node" cx="100" cy="75" r="3.5" />
    <circle class="node" cx="140" cy="75" r="3.5" />
    <!-- Row 4 -->
    <circle class="node" cx="80" cy="100" r="3.5" />
    <circle class="node" cx="120" cy="100" r="3.5" />
    <!-- Row 5 -->
    <circle class="node" cx="100" cy="125" r="3.5" />
  </g>
</svg>
